[package]
name = "vector-qdrant"
version = "0.1.0"
edition = "2024"


[lib]
path = "src/lib.rs"
crate-type =["cdylib"]


[features]
default = ["durability"]
durability = ["golem-rust/durability","golem-vector/durability"]

[package.metadata.component]
package = "golem:vector-qdrant"

[package.metadata.component.bindings]
generate_unused_types = true


[package.metadata.component.target]
path = "wit"

[package.metadata.component.target.dependencies]
"golem:vector" = { path = "wit/deps/golem-vector"}
"wasi:io" = {path = "wit/deps/wasi:io"}

[dependencies]
wit-bindgen-rt = { workspace = true, features = ["bitflags"] }
golem-vector = {path = "../vector", version = "0.1.0", default-features = false}
golem-rust = {workspace = true}
log = {workspace = true}
reqwest = {workspace = true}
serde = {workspace = true}
serde_json = { workspace = true}
base64 = {workspace = true}